<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Under Construction | Nicholas Charpentier</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/af113090fb.js" crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: #000000;
            font-family: 'Open Sans', Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #ffffff;
        }

        .container {
            background-color: #1f1f1f;
            padding: 60px 40px;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(50, 205, 50, 0.15);
            max-width: 500px;
        }

        h1 {
            color: #32CD32;
            font-size: 32px;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        p {
            font-size: 16px;
            color: #cccccc;
            margin-top: 0;
        }

        .icon {
            font-size: 60px;
            color: #32CD32;
            margin-bottom: 25px;
            animation: spin 8s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .subtle {
            margin-top: 25px;
            font-size: 14px;
            color: #888888;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">
            <i class="fab fa-canadian-maple-leaf"></i>
        </div>

        <h1>Page Under Construction</h1>

        <p>
            This GIS portfolio is currently being updated.
            <br>
			Please check back soon.
        </p>

        <div class="subtle">
            Nick Charpentier © <script>document.write(new Date().getUTCFullYear());</script>
        </div>
    </div>

</body>
</html>
